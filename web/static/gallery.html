<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Live2D 模型挑选 · 小肥鱼直播间</title>
<style>
  body { background:#0b1220; color:#dce6f5; font:"Microsoft YaHei",system-ui,sans-serif; margin:0; padding:14px; }
  h1 { font-size:15px; color:#7d8aa5; font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; }
  .cell { background:#111a2c; border:1px solid #1e2a44; border-radius:10px; overflow:hidden; position:relative; }
  .cell .tag { position:absolute; left:8px; top:8px; z-index:3; background:rgba(7,16,31,.85);
               color:#5eead4; padding:3px 10px; border-radius:6px; font-size:13px; font-weight:600; }
  .cell iframe { width:100%; height:330px; border:0; }
</style>
</head>
<body>
<h1>Live2D 模型挑选（8 款 · 官方示例，实时渲染）</h1>
<div class="grid" id="grid"></div>
<script>
const models = [
  ["Hiyori", "Hiyori/Hiyori.model3.json"],
  ["Mao", "Mao/Mao.model3.json"],
  ["Rice", "Rice/Rice.model3.json"],
  ["Natori", "Natori/Natori.model3.json"],
  ["Wanko", "Wanko/Wanko.model3.json"],
  ["Ren", "Ren/Ren.model3.json"],
  ["Mark", "Mark/Mark.model3.json"],
  ["haru（现用）", "haru/haru_greeter_t03.model3.json"],
];
const grid = document.getElementById("grid");
for (const [name, file] of models) {
  const cell = document.createElement("div");
  cell.className = "cell";
  cell.innerHTML = `<span class="tag">${name}</span>`;
  const iframe = document.createElement("iframe");
  iframe.src = `/?model=${file}&gallery=1`;   // file 来自本页白名单，含 / 不能整体编码
  cell.appendChild(iframe);
  grid.appendChild(cell);
}
</script>
</body>
</html>
