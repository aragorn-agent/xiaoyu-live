<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>挑选 Live2D 形象 · 小肥鱼直播间</title>
<style>
  :root { --bg:#0b1220; --panel:#111a2c; --line:#1e2a44; --text:#dce6f5; --dim:#7d8aa5; --accent:#5eead4; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:14px/1.5 "Microsoft YaHei",system-ui,sans-serif; padding:16px; }
  header { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  header h1 { font-size:16px; }
  header .note { color:var(--dim); font-size:12px; }
  main { display:grid; grid-template-columns: 560px 1fr; gap:14px; }
  /* 左：缩略图网格 */
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .card { background:var(--panel); border:2px solid var(--line); border-radius:12px; overflow:hidden; cursor:pointer; transition:.15s; position:relative; }
  .card:hover { border-color:var(--accent); transform:translateY(-2px); }
  .card.active { border-color:var(--accent); box-shadow:0 0 18px rgba(94,234,212,.25); }
  .card img { width:100%; height:150px; object-fit:cover; object-position:top; display:block; }
  .card .nm { padding:6px 10px; font-size:13px; }
  .card .nm small { color:var(--dim); display:block; font-size:11px; }
  .card .badge { position:absolute; top:6px; left:6px; background:var(--accent); color:#06281f; font-size:11px;
                 padding:2px 8px; border-radius:6px; font-weight:700; display:none; }
  .card.active .badge { display:block; }
  .card.disabled { opacity:.45; cursor:not-allowed; }
  /* 右：实时预览 */
  .preview { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
  .preview h2 { font-size:12px; color:var(--dim); padding:8px 12px; border-bottom:1px solid var(--line); }
  .preview iframe { flex:1; border:0; width:100%; min-height:520px; }
  .actions { padding:10px; display:flex; gap:8px; }
  button { background:#1b2745; color:var(--text); border:1px solid var(--line); border-radius:8px;
           padding:9px 16px; cursor:pointer; font-size:13px; }
  button.primary { background:var(--accent); color:#06281f; font-weight:700; border-color:var(--accent); }
  button:hover { filter:brightness(1.15); }
  #toast { position:fixed; bottom:18px; right:18px; background:var(--accent); color:#06281f; font-weight:700;
           padding:10px 18px; border-radius:10px; display:none; z-index:9; }
</style>
</head>
<body>
<header>
  <h1>挑选 Live2D 形象</h1>
  <span class="note">点卡片实时预览 → 满意就"设为默认"（舞台刷新生效）· Ren 为 Cubism5 格式暂不可用</span>
</header>
<main>
  <section>
    <div class="grid" id="grid"></div>
  </section>
  <section class="preview">
    <h2>实时预览：<span id="curName">—</span></h2>
    <iframe id="pv" src=""></iframe>
    <div class="actions">
      <button class="primary" id="applyBtn">✔ 设为默认形象</button>
      <button id="openStage">在完整舞台打开 ↗</button>
    </div>
  </section>
</main>
<div id="toast">已保存！刷新舞台页生效</div>
<script>
const MODELS = [
  {id:"Hiyori/Hiyori.model3.json", name:"Hiyori", desc:"官方门面 · 元气少女 · 表情动作最全", img:"/static/previews/hiyori.png"},
  {id:"Mao/Mao.model3.json", name:"Mao", desc:"魔女风 · 质感最高 · 辨识度强", img:"/static/previews/mao.png"},
  {id:"Rice/Rice.model3.json", name:"Rice", desc:"银发文静 · 学生装", img:"/static/previews/rice.png"},
  {id:"Natori/Natori.model3.json", name:"Natori", desc:"眼镜绅士 · 男主播路线", img:"/static/previews/natori.png"},
  {id:"Wanko/Wanko.model3.json", name:"Wanko", desc:"萌宠小狗 · 连麦搭子位", img:"/static/previews/wanko.png"},
  {id:"Mark/Mark.model3.json", name:"Mark", desc:"美式卡通 · 简约", img:"/static/previews/mark.png"},
  {id:"haru/haru_greeter_t03.model3.json", name:"haru（现用）", desc:"职业装小姐姐", img:"/static/previews/haru.png"},
  {id:"Ren/Ren.model3.json", name:"Ren", desc:"Cubism5 格式 · 需升级运行库", img:null, disabled:true},
];
const $ = (s) => document.querySelector(s);
const grid = $("#grid");
let current = null;

fetch("/api/models").then(r=>r.json()).then(d => {
  const cur = (d.current || "haru/haru_greeter_t03.model3.json");
  for (const m of MODELS) {
    const card = document.createElement("div");
    card.className = "card" + (m.disabled ? " disabled" : "") + (m.id === cur ? " active" : "");
    card.innerHTML = (m.id === cur ? '<span class="badge">现用</span>' : "") +
      (m.img ? `<img src="${m.img}" loading="lazy">` : '<div style="height:150px;display:flex;align-items:center;justify-content:center;color:#7d8aa5">无预览</div>') +
      `<div class="nm">${m.name}<small>${m.desc}</small></div>`;
    if (!m.disabled) card.onclick = () => select(m, card);
    grid.appendChild(card);
    if (m.id === cur) { current = m; $("#curName").textContent = m.name; $("#pv").src = `/?model=${m.id}&gallery=1`; }
  }
});

function select(m, card) {
  document.querySelectorAll(".card").forEach(c => c.classList.remove("active"));
  card.classList.add("active");
  current = m;
  $("#curName").textContent = m.name;
  $("#pv").src = `/?model=${m.id}&gallery=1`;
}

$("#applyBtn").onclick = async () => {
  if (!current) return;
  await fetch("/api/config", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({path:"render.live2d.model", value: current.id})});
  const t = $("#toast");
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 2200);
};
$("#openStage").onclick = () => window.open(`/?model=${current ? current.id : ""}`, "_blank");
</script>
</body>
</html>
